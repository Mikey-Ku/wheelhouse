spring.application.name=wheelhouse

# Virtual threads: every poll and every request gets its own thread, blocking code stays
# blocking, and the platform thread pool stops being a ceiling.
spring.threads.virtual.enabled=true

# ESPN's edge blocks unrecognised and browser-impersonating user agents, including Java's
# default. Identify honestly with a contact URL; that passes and is good manners.
wheelhouse.espn.user-agent=Wheelhouse/0.1 (+https://github.com/Mikey-Ku)

# Polling intervals. The scoreboard is cheap and slow-moving; box scores are the hot path.
wheelhouse.poll.scoreboard-ms=30000
wheelhouse.poll.boxscore-ms=15000

# Sleeper asks callers to pull the player list about once a day rather than per request,
# so it is cached on disk and survives restarts.
wheelhouse.sleeper.cache-dir=.cache
wheelhouse.sleeper.cache-ttl-hours=20
wheelhouse.sleeper.refresh-ms=43200000

# Relevance cutoff for the wheel. Lower means only stars, higher drags in players nobody
# recognises. 400 gives roughly 130 WR, 92 RB, 53 QB, 52 TE.
wheelhouse.wheel.rank-cutoff=400

# Standard PPR fantasy scoring wherever a standard value exists: 1 point per 25 passing yards,
# 4 per passing TD, 1 per 10 rushing or receiving yards, 6 per rushing or receiving TD, 1 per
# reception, -2 per interception or lost fumble. Legibility is the point. Everyone already knows
# a touchdown is six.
#
# Four parts have no standard fantasy value at all, because no league scores them: completions,
# pass attempts, carries and targets. Those use house values, set so a typical starter's game
# lands in the same 8-12 point band as the standard parts beside them. They are marked below.
# Run tools/calibrate.py to see how lopsided each slot's choice currently is.
wheelhouse.scoring.multipliers[qb.arm]=0.04
wheelhouse.scoring.multipliers[qb.shoulders]=4.0
wheelhouse.scoring.multipliers[qb.legs]=0.1
wheelhouse.scoring.multipliers[qb.cleats]=6.0
wheelhouse.scoring.multipliers[qb.head]=-2.0

wheelhouse.scoring.multipliers[rb.legs]=0.1
wheelhouse.scoring.multipliers[rb.nose]=6.0
wheelhouse.scoring.multipliers[rb.hands]=1.0
wheelhouse.scoring.multipliers[rb.chest]=0.1
wheelhouse.scoring.multipliers[rb.grip]=-2.0

wheelhouse.scoring.multipliers[flex.hands]=1.0
wheelhouse.scoring.multipliers[flex.chest]=0.1
wheelhouse.scoring.multipliers[flex.nose]=6.0
wheelhouse.scoring.multipliers[flex.grip]=-2.0

logging.level.dev.mikeyku.wheelhouse=INFO

# ---- persistence ----
# File-backed rather than the in-memory default Boot falls back to when nothing is configured.
# Everything written since the project started has been discarded on every restart, which the
# README had been claiming otherwise about for months. .data/ is already gitignored.
spring.datasource.url=jdbc:h2:file:./.data/wheelhouse;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
