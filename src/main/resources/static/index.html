<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheelhouse</title>
<meta name="description" content="Spin for NFL players, take one stat off each, and score on what really happens. Thursday, Sunday and Monday slates.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wheelhouse">
<meta property="og:title" content="Wheelhouse">
<meta property="og:description" content="Spin for NFL players, take one stat off each, and score on what really happens.">
<meta property="og:image" content="/img/social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/img/social.jpg">
<meta name="theme-color" content="#05091d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  /* ---------- home ---------- */
  .hero{position:relative;padding:40px 0 8px}
  .hero::before{content:"";position:absolute;z-index:-1;pointer-events:none;top:-80px;right:-120px;
    width:min(720px,80%);aspect-ratio:3/2;background:url("img/lights.jpg") center/cover no-repeat;
    mix-blend-mode:screen;opacity:.5;
    -webkit-mask-image:radial-gradient(ellipse 74% 70% at 74% 32%,#000 14%,transparent 78%);
    mask-image:radial-gradient(ellipse 74% 70% at 74% 32%,#000 14%,transparent 78%)}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--secondary);margin-bottom:12px}
  .hero h1{margin:12px 0 22px}
  .countdown{display:flex;gap:10px;flex-wrap:wrap}
  .countdown div{min-width:84px;background:rgba(19,27,56,.85);border:1px solid var(--line-hi);border-radius:12px;
    padding:10px 12px 8px;text-align:center}
  .countdown b{display:block;font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
  .countdown span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .cd-note{color:var(--secondary);margin:12px 0 22px}
  .hero-cta{display:flex;gap:10px;flex-wrap:wrap}
  @media (max-width:640px){.countdown div{min-width:0;flex:1}.countdown b{font-size:38px}}

  .slates{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .slate{background:rgba(19,27,56,.9);border:1px solid var(--line);border-radius:14px;padding:18px;
    display:flex;flex-direction:column;gap:14px;min-width:0}
  .slate.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .slate.locked{opacity:.7}
  .slate-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .slate-when{font-family:var(--mono);font-size:12.5px;color:var(--secondary)}
  .matchup{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:26px}
  .matchup img{width:44px;height:44px}
  .matchup .at{color:var(--dim);font-size:16px}
  .crests{display:flex;flex-wrap:wrap;gap:6px}
  .crests img{width:28px;height:28px}
  .rules{font-size:13.5px;color:var(--secondary)}
  .rules b{color:var(--text);font-weight:600}
  .slate-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;flex-wrap:wrap}
  .slate-foot .status{font-size:13.5px;color:var(--secondary)}
  .slate-foot .status b{color:var(--accent);font-family:var(--mono)}
  .slate-foot .btns{display:flex;gap:8px}

  .past-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .past-row .or{color:var(--muted);align-self:center}
  .past-pick{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .past-pick .field{margin:0}
  .past-pick select{width:130px}
  #weekReels{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin-top:16px}

  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .step{background:rgba(19,27,56,.85);border:1px solid var(--line);border-radius:14px;padding:18px}
  .step .pi{color:var(--accent);width:34px;height:34px}
  .step b{display:block;font-family:var(--display);font-size:22px;text-transform:uppercase;margin:10px 0 4px}
  .step span{color:var(--secondary);font-size:14.5px}

  /* ---------- loading a past week ---------- */
  .loader{max-width:560px;margin:60px auto;text-align:center}
  .loader h2{font-size:36px}
  .loader p{color:var(--muted);margin-top:8px;min-height:24px}
  .bar{height:3px;background:var(--surface-deep);border-radius:2px;overflow:hidden;margin:20px auto 0;max-width:420px}
  .bar span{display:block;height:100%;width:34%;background:var(--accent);animation:sweep 1.1s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}

  /* ---------- the draft ---------- */
  .play-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:26px 0 14px}
  .play-head .t{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .play-head h2{font-size:32px}
  .pickmap{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:rgba(19,27,56,.85);
    border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .pm-group{display:flex;align-items:center;gap:6px}
  .pm-group > span{font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--secondary);margin-right:2px}
  .pm-group i{width:22px;height:8px;border-radius:4px;background:var(--line-hi)}
  .pm-group i.done{background:var(--accent-deep)}
  .pm-group i.now{background:var(--accent);box-shadow:0 0 0 3px rgba(0,255,249,.18)}
  .pm-step{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--secondary)}

  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
  @media (max-width:1060px){.pgrid{grid-template-columns:minmax(0,1fr)}}
  .stage{background:var(--surface);border:1px solid var(--line-hi);border-radius:16px;padding:24px}
  @media (max-width:640px){.stage{padding:16px}}
  .say{font-size:16px;color:var(--text);margin-bottom:16px}
  .say span{color:var(--muted)}

  .reels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:12px;margin-bottom:18px}
  .reelbox{background:linear-gradient(rgba(11,16,40,.82),rgba(11,16,40,.88)),url("img/metal.jpg") 0 0/360px repeat,var(--surface-deep);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:hidden}
  .reelbox.landed{border-color:var(--accent)}
  .reelcap{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .reel-team{display:flex;align-items:center;gap:14px}
  .reel-team img{width:52px;height:52px}
  .reel{height:64px;overflow:hidden;position:relative;min-width:0;flex:1}
  .reel::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(var(--surface-deep),transparent 34%,transparent 66%,var(--surface-deep))}
  .reel-strip{position:absolute;top:0;left:0;right:0;will-change:transform}
  .reel-item{height:64px;display:flex;align-items:center;font-family:var(--display);font-weight:700;
    font-size:44px;letter-spacing:.03em;line-height:1;white-space:nowrap;color:var(--dim)}
  .reel-item.name{font-size:28px;overflow:hidden;text-overflow:ellipsis;display:block;line-height:64px}
  .reel-item.hit{color:var(--text)}
  @keyframes reelspin{from{transform:translateY(0)}to{transform:translateY(-1280px)}}
  .reel-strip.spinning{animation:reelspin .55s linear infinite}
  @media (max-width:640px){
    .reels{grid-template-columns:minmax(0,84px) minmax(0,1fr);gap:8px}
    .reel,.reel-item{height:48px}.reel-item{font-size:28px}.reel-item.name{font-size:18px;line-height:48px}
    @keyframes reelspin{from{transform:translateY(0)}to{transform:translateY(-960px)}}
    .reel-team img{width:38px;height:38px}
    .reel-team:has(img) .reel{display:none}
  }

  .who{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .who .face{width:68px;height:68px}
  .who .nm{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
  .who .sub{font-size:13px;color:var(--secondary);letter-spacing:.06em;text-transform:uppercase}
  .who .injury{color:var(--live)}
  .who .respins{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:640px){.who .respins{margin-left:0;width:100%}.who .respins .btn{flex:1}}
  .btn .cnt{font-family:var(--display);font-size:15px;background:rgba(0,255,249,.12);color:var(--accent);
    border-radius:5px;padding:2px 7px;letter-spacing:0}
  .btn:disabled .cnt{color:var(--dim);background:rgba(255,255,255,.05)}

  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;
    background:var(--surface-deep);border:1px solid var(--line-hi);border-radius:12px;padding:14px 15px}
  .opt:hover{border-color:var(--accent);background:#0e1636}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:640px){
    .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .opt{padding:12px}
    .opt-top{flex-direction:column;align-items:flex-start;gap:6px}
    .opt-top .pi{width:24px;height:24px;align-self:flex-start}
    .opt-top span{font-size:10.5px}
    .opt-pts{font-size:26px}
    .formtxt{font-size:11px}
  }
  .opt-top{display:flex;align-items:center;gap:10px;color:var(--accent)}
  .opt-top b{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--text);line-height:1}
  .opt-top span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .opt-pts{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--accent);margin-top:4px}
  .opt-pts small{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--accent-deep);margin-left:5px}
  .opt-proj{font-size:12.5px;color:var(--secondary)}
  .bars{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:6px}
  .bars i{flex:1;min-height:2px;border-radius:1px;background:var(--line-hi)}
  .bars i.ok{background:var(--accent-deep)}
  .formtxt{font-size:12px;color:var(--muted)}
  .formtxt b{color:var(--secondary);font-weight:600}

  .gt-head{margin:22px 0 10px;font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase}
  .gt-head span{font-family:var(--sans);font-weight:400;font-size:13px;text-transform:none;color:var(--muted);margin-left:8px}
  .tblwrap{background:var(--surface-deep);border:1px solid var(--line-hi);border-radius:12px;overflow-x:auto}
  table.gt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  table.gt th,table.gt td{padding:9px 10px;text-align:right;white-space:nowrap}
  table.gt th:first-child,table.gt td:first-child{padding-left:14px;text-align:left}
  table.gt td.opp,table.gt th.opp{text-align:left}
  table.gt thead th{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--line-hi);vertical-align:bottom;padding-top:12px}
  table.gt thead th b{display:block;font-family:var(--display);font-size:16px;color:var(--secondary);letter-spacing:.04em}
  table.gt tbody td{border-top:1px solid rgba(37,52,93,.5);color:var(--muted)}
  table.gt td.v{font-family:var(--display);font-weight:700;font-size:17px;color:var(--secondary)}
  table.gt td.v.ok{color:var(--accent)}
  table.gt td.opp img{width:17px;height:17px;vertical-align:-3px;margin-left:6px}
  table.gt tfoot td{border-top:1px solid var(--line-hi);color:var(--secondary);font-size:12.5px}
  table.gt tfoot td:first-child{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
  table.gt tfoot b.hot{color:var(--accent)} table.gt tfoot b.cold{color:var(--live)}

  .rail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:78px}
  @media (max-width:1060px){.rail{position:static}}
  .rail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .rail-head b{font-family:var(--display);font-size:32px;color:var(--accent);line-height:1}
  .rail-head small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:4px}
  .rp{border-top:1px solid var(--line);padding:10px 0 4px}
  .rp-head{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--secondary);margin-bottom:4px}
  .rp-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px}
  .rp-row .pi{color:var(--accent)}
  .rp-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rp-row .pt{font-family:var(--display);font-weight:700;font-size:17px}
  .rp-row.open{color:var(--dim)}
  .rp-row.open .nm{border-bottom:1px dashed var(--line-hi);height:1px;align-self:center}
  .rp-row.now{color:var(--accent)}
  .rp-left{font-size:12px;color:var(--muted);padding:2px 0 6px}

  /* ---------- the slip ---------- */
  .done-wrap{max-width:480px;margin:30px auto 0}
  .done-head{text-align:center;margin-bottom:16px}
  .done-head h2{font-size:30px;margin-top:10px}
  .sp{background:var(--paper);color:var(--ink);border-radius:12px;padding:20px 22px 18px;font-family:var(--mono);font-size:12.5px}
  .sp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .sp-title{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
  .sp-meta{font-size:11.5px;color:#6f7078;text-align:right}
  .sp-row{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:10px;align-items:center;
    padding:7px 0;border-top:1px dashed #cbc6b8;opacity:0;transform:translateY(3px);transition:opacity .22s,transform .22s}
  .sp-row.in,.sp.instant .sp-row{opacity:1;transform:none}
  .sp-pos{font-size:10.5px;letter-spacing:.08em;color:#7d8189;white-space:nowrap}
  .sp-who{display:flex;align-items:center;gap:8px;min-width:0}
  .sp-who .pi{color:#5d6170;width:18px;height:18px}
  .sp-nm{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp-part{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8b8f97;white-space:nowrap}
  .sp-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;line-height:1.2}
  .sp-v small{display:block;font-weight:400;font-size:10.5px;color:#8b8f97}
  .sp-v.pre{color:#6f7078;font-weight:500}
  .sp-v.up{color:#0b7a5c}.sp-v.dn{color:#b3263e}
  .sp-v .clk{color:#b3263e;font-size:10px;font-weight:500}
  .sp-foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px solid var(--ink);margin-top:6px;padding-top:12px}
  .sp-big{font-family:var(--display);font-weight:700;font-size:42px;line-height:.9}
  .sp-acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .sp-acts .btn{flex:1;min-width:120px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);height:46px}
  .sp-acts .btn:hover{background:var(--ink);color:var(--paper)}
  .sp-acts .btn.go{background:var(--ink);color:var(--paper)}
  .save{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:14px}
  .save b{display:block;font-family:var(--display);font-size:20px;text-transform:uppercase}
  .save span{color:var(--secondary);font-size:14px}
  @media (max-width:600px){.save .btn{width:100%}}
  @media (max-width:600px){.sp{padding:18px 15px}.sp-title{font-size:22px}
    .sp-row{grid-template-columns:46px minmax(0,1fr) 56px;gap:8px}.sp-nm{font-size:16px}.sp-part{display:none}}
</style>
</head>
<body data-page="play">
<nav id="nav" class="top"></nav>

<main class="wrap">
  <!-- home -->
  <div id="home" hidden>
    <section class="hero" id="hero"></section>
    <section class="sec">
      <div class="sec-head"><h2>This week</h2><p>Each slate locks when its first game kicks off.</p></div>
      <div class="slates" id="slates"></div>
    </section>
    <section class="sec" id="past">
      <div class="sec-head"><h2>Past weeks</h2><p id="pastNote">Real weeks from past seasons. You play against that week's projections.</p></div>
      <div class="past-row">
        <button class="btn lg" id="rollBtn">Random week</button>
        <span class="or">or</span>
        <div class="past-pick">
          <label class="field"><span>Season</span><select id="season"></select></label>
          <label class="field"><span>Week</span><select id="week"></select></label>
          <button class="btn lg" id="pickBtn">Play this week</button>
        </div>
      </div>
      <div id="weekReels" hidden>
        <div class="reelbox" id="seasonBox"><div class="reelcap">Season</div><div id="seasonReel"></div></div>
        <div class="reelbox" id="wkBox"><div class="reelcap">Week</div><div id="wkReel"></div></div>
      </div>
      <p class="err" id="pastErr" style="margin-top:12px"></p>
    </section>
    <section class="sec">
      <div class="sec-head"><h2>How to play</h2></div>
      <div class="steps" id="steps"></div>
    </section>
  </div>

  <!-- loading a past week -->
  <div id="loader" class="loader" hidden>
    <h2 id="loaderTitle"></h2>
    <p id="loaderSub"></p>
    <div class="bar"><span></span></div>
  </div>

  <!-- the draft -->
  <div id="play" hidden>
    <div class="play-head"><div class="t" id="playTitle"></div></div>
    <div class="pickmap" id="pickmap"></div>
    <div class="pgrid">
      <div>
        <div class="stage" id="stage"></div>
        <p class="err" id="err" style="margin-top:10px"></p>
      </div>
      <aside class="rail" id="rail"></aside>
    </div>
  </div>

  <!-- a finished roster -->
  <div id="done" class="done-wrap" hidden>
    <div class="done-head" id="doneHead"></div>
    <div id="slip" class="sp"></div>
  </div>

  <div id="gone" hidden class="empty" style="margin-top:60px"></div>
</main>

<script src="/app.js"></script>
<script>
const { esc, fmt1, api } = WH;
const params = new URLSearchParams(location.search);
const rosterId = params.get("r");
const shareId = params.get("s");

let entry = null;
let board = null;       // this week's slates
let mine = [];          // your rosters, if signed in
let viewing = false;    // a shared slip, read-only
let busy = false;       // a spin is animating; nothing may redraw the stage
let slipState = "none"; // none -> playing -> done

const show = (id, on) => { document.getElementById(id).hidden = !on; };
const fmt = n => n == null ? "0" : String(Math.round(n * 10) / 10);
const shortName = n => {
  const p = String(n || "").trim().split(/\s+/);
  return p.length > 1 ? p[0][0] + ". " + p.slice(1).join(" ") : (n || "");
};
/* Classic has two flex positions, each with its own stats, so they are numbered. */
const posName = (slot, pos) => {
  if (slot !== "FLEX") return slot;
  const flexes = entry ? entry.positions.filter(p => p.slot === "FLEX") : [];
  return flexes.length > 1 && pos ? "Flex " + (flexes.indexOf(pos) + 1) : "Flex";
};
const RULES = {
  SHOWDOWN: { picks: 7, text: "<b>7 picks</b>: 2 QB, 2 RB, 3 Flex", respins: 1 },
  CLASSIC: { picks: 14, text: "<b>14 picks</b>: 4 QB, 4 RB, 6 Flex", respins: 3 },
};

/* ================= home ================= */

function countdownParts(iso) {
  let s = Math.max(0, Math.floor((new Date(iso) - Date.now()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  return { d, h, m, s };
}
const pad = n => String(n).padStart(2, "0");
const shortCount = iso => {
  const { d, h, m } = countdownParts(iso);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
};

function myFor(slateKey) {
  return mine.filter(r => r.current && r.slate === slateKey);
}

function renderHero() {
  const host = document.getElementById("hero");
  const week = board && board.week;
  const next = board && board.slates.find(s => s.key === board.next);
  if (!week) { host.innerHTML = `<h1>Wheelhouse</h1>`; return; }
  if (week.ready === false) {
    host.innerHTML = `<div class="kicker">${esc(week.label)}</div><h1>Warming up</h1>
      <p class="cd-note">Loading players. This takes about a minute after a restart.</p>`;
    setTimeout(() => location.reload(), 8000);
    return;
  }
  if (!next) {
    host.innerHTML = `<div class="kicker">${esc(week.label)}</div>
      <h1>Games are on</h1>
      <p class="cd-note">Every slate this week has kicked off. Watch your rosters score, or play a past week.</p>
      <div class="hero-cta"><a class="btn primary lg" href="/live.html">Watch live</a>
        <a class="btn lg" href="#past">Play a past week</a></div>`;
    return;
  }
  const inProgress = myFor(next.key).find(r => !r.complete);
  const g = next.games.length === 1 ? next.games[0] : null;
  host.innerHTML = `<div class="kicker">${esc(week.label)}</div>
    ${WH.badge(next.key, next.label, "lg")}
    <h1>${g ? `${esc(g.away)} @ ${esc(g.home)}` : `${next.games.length} games`}</h1>
    <div class="countdown" id="cd"></div>
    <p class="cd-note">Rosters lock at kickoff, ${esc(WH.kickoffText(next.lockAt))} ET.</p>
    <div class="hero-cta">
      ${inProgress
        ? `<a class="btn primary lg" href="/?r=${esc(inProgress.entryId)}">Finish your roster</a>`
        : `<button class="btn primary lg" data-slate="${esc(next.key)}">Play ${esc(next.label)}</button>`}
    </div>`;
  tickCountdown();
}

function tickCountdown() {
  const el = document.getElementById("cd");
  const next = board && board.slates.find(s => s.key === board.next);
  if (!el || !next) return;
  const { d, h, m, s } = countdownParts(next.lockAt);
  if (d + h + m + s === 0) { location.reload(); return; }
  el.innerHTML = (d ? `<div><b>${d}</b><span>${d === 1 ? "day" : "days"}</span></div>` : "")
    + `<div><b>${pad(h)}</b><span>hrs</span></div><div><b>${pad(m)}</b><span>min</span></div>`
    + `<div><b>${pad(s)}</b><span>sec</span></div>`;
}

function renderSlates() {
  const host = document.getElementById("slates");
  if (!board || !board.slates.length) {
    host.innerHTML = `<div class="empty"><b>No games this week</b>Play a past week below.</div>`;
    return;
  }
  const playable = board.week.ready !== false && board.week.hasProjections !== false;
  host.innerHTML = board.slates.map(sl => {
    const locked = sl.locked || new Date(sl.lockAt) <= Date.now();
    const rules = RULES[sl.format] || RULES.CLASSIC;
    const games = sl.games.length === 1
      ? `<div class="matchup"><img src="${esc(sl.games[0].awayLogo)}" alt="">${esc(sl.games[0].away)}
          <span class="at">@</span>${esc(sl.games[0].home)}<img src="${esc(sl.games[0].homeLogo)}" alt=""></div>`
      : `<div class="crests">${sl.games.flatMap(g => [g.awayLogo, g.homeLogo])
          .map(u => `<img src="${esc(u)}" alt="">`).join("")}</div>`;
    const mineHere = myFor(sl.key);
    const building = mineHere.find(r => !r.complete);
    const done = mineHere.filter(r => r.complete)
      .sort((a, b) => (b.total ?? b.projectedTotal) - (a.total ?? a.projectedTotal))[0];
    let foot;
    if (building && !locked) {
      foot = `<span class="status">${building.picked} of ${building.totalPicks} picked</span>
        <span class="btns"><a class="btn primary sm" href="/?r=${esc(building.entryId)}">Finish</a></span>`;
    } else if (done) {
      foot = `<span class="status">You're in &middot; ${fmt1(done.status === "pending" ? done.projectedTotal : done.total)}
          ${done.status === "pending" ? "proj" : "pts"}</span>
        <span class="btns"><a class="btn sm" href="/?r=${esc(done.entryId)}">View</a>
          ${locked ? "" : `<button class="btn sm" data-slate="${esc(sl.key)}" ${playable ? "" : "disabled"}>Play again</button>`}</span>`;
    } else if (locked) {
      foot = `<span class="status">Kicked off</span>
        <span class="btns"><a class="btn sm" href="/live.html">Watch live</a></span>`;
    } else {
      foot = `<span class="status">Locks in <b>${shortCount(sl.lockAt)}</b></span>
        <span class="btns"><button class="btn ${sl.key === board.next ? "primary" : ""} sm" data-slate="${esc(sl.key)}"
          ${playable ? "" : "disabled"}>Play</button></span>`;
    }
    return `<div class="slate ${locked ? "locked" : ""} ${sl.key === board.next ? "next" : ""}">
      <div class="slate-top">${WH.badge(sl.key, sl.label)}<span class="slate-when">${esc(WH.kickoffText(sl.lockAt))}</span></div>
      ${games}
      <div class="rules">${rules.text}<br>Respins: ${rules.respins} team, ${rules.respins} player</div>
      <div class="slate-foot">${foot}</div></div>`;
  }).join("");
}

function renderSteps() {
  document.getElementById("steps").innerHTML = [
    ["legs", "Spin", "The wheel picks a team, then one of its players."],
    ["arm", "Take one stat", "Arm, legs, hands and more. Each stat once per position."],
    ["chest", "Fill every pick", "7 picks on Thursday and Monday nights. 14 on Sunday."],
    ["cleats", "Score", "Standard PPR points from what really happens."],
  ].map(([icon, title, text]) => `<div class="step">${WH.part(icon)}<b>${title}</b><span>${text}</span></div>`).join("");
}

let archiveRange = null;
async function loadArchive() {
  archiveRange = await api("/api/play/archive");
  const years = [];
  for (let y = archiveRange.latest; y >= archiveRange.earliest; y--) years.push(y);
  document.getElementById("season").innerHTML = years.map(y => `<option>${y}</option>`).join("");
  const weeks = [];
  for (let w = 1; w <= archiveRange.weeks; w++) weeks.push(w);
  document.getElementById("week").innerHTML = weeks.map(w => `<option value="${w}">Week ${w}</option>`).join("");
  document.getElementById("pastNote").textContent =
    `Any week from ${archiveRange.earliest} to ${archiveRange.latest}. You play against that week's projections.`;
}

async function showHome() {
  show("home", true);
  renderHero();
  renderSlates();
  renderSteps();
  await loadArchive();
  document.getElementById("home").addEventListener("click", e => {
    const b = e.target.closest("[data-slate]");
    if (b) startSlate(b.dataset.slate, b);
  });
  document.getElementById("rollBtn").addEventListener("click", rollWeek);
  document.getElementById("pickBtn").addEventListener("click", () =>
    startPast(document.getElementById("season").value, document.getElementById("week").value));
  setInterval(() => { tickCountdown(); }, 1000);
  setInterval(() => { if (!document.hidden) renderSlates(); }, 30000);
}

async function startSlate(key, btn) {
  try {
    await WH.ensurePlayer();
    if (btn) btn.disabled = true;
    const e = await api("/api/play/open", { method: "POST", params: { slate: key } });
    location.href = "/?r=" + encodeURIComponent(e.entryId);
  } catch (e) {
    if (btn) btn.disabled = false;
    if (!e.cancelled) WH.toast(e.message);
  }
}

const LOAD_STEPS = ["Finding the games", "Pulling every box score", "Matching players",
  "Reading that week's projections", "Hiding the results"];

async function startPast(season, week) {
  const err = document.getElementById("pastErr");
  err.textContent = "";
  try { await WH.ensurePlayer(); } catch (e) { err.textContent = e.message; return; }
  show("home", false); show("loader", true);
  document.getElementById("loaderTitle").textContent = `${season} · Week ${week}`;
  let i = 0;
  const sub = document.getElementById("loaderSub");
  sub.textContent = LOAD_STEPS[0];
  const ticker = setInterval(() => { sub.textContent = LOAD_STEPS[Math.min(++i, LOAD_STEPS.length - 1)]; }, 1300);
  try {
    const e = await api("/api/play/open", { method: "POST", params: { season, week } });
    location.href = "/?r=" + encodeURIComponent(e.entryId);
  } catch (e) {
    clearInterval(ticker);
    show("loader", false); show("home", true);
    err.textContent = e.message;
  }
}

/* The random week is dealt by the same reels as the draft. */
async function rollWeek() {
  try { await WH.ensurePlayer(); } catch (e) { return; }
  const seasons = [], weeks = [];
  for (let y = archiveRange.earliest; y <= archiveRange.latest; y++) seasons.push(String(y));
  for (let w = 2; w <= archiveRange.weeks; w++) weeks.push(String(w));
  const season = seasons[Math.floor(Math.random() * seasons.length)];
  const week = weeks[Math.floor(Math.random() * weeks.length)];
  document.getElementById("weekReels").hidden = false;
  document.getElementById("rollBtn").disabled = true;
  const a = buildReel(document.getElementById("seasonReel"), seasons, "");
  const b = buildReel(document.getElementById("wkReel"), weeks, "");
  await landReel(a, seasons, season, "");
  document.getElementById("seasonBox").classList.add("landed");
  await landReel(b, weeks, week, "");
  document.getElementById("wkBox").classList.add("landed");
  await new Promise(r => setTimeout(r, 350));
  startPast(season, week);
}

function formStrip(f) {
  if (!f || !f.games || !f.games.length) {
    return `<div class="bars">${"<i></i>".repeat(6)}</div><div class="formtxt">No games yet</div>`;
  }
  const max = Math.max(...f.games.map(g => g.value), f.line || 0, 1);
  const bars = f.games.map(g =>
    `<i class="${g.cleared ? "ok" : ""}" style="height:${Math.max(2, Math.round(g.value / max * 26))}px"
       title="${esc(weekLabel(g))} ${g.home ? "vs" : "at"} ${esc(g.opponent)}: ${fmt(g.value)}"></i>`).join("");
  const pct = f.line != null && f.played ? Math.round(100 * f.cleared / f.played) : null;
  return `<div class="bars">${bars}</div>
    <div class="formtxt">Last ${f.played} avg <b>${fmt(f.average)}</b>${pct == null ? "" : ` &middot; over proj <b>${pct}%</b>`}</div>`;
}

const thisSeason = () => (entry && entry.contest && entry.contest.season) || 0;
const weekLabel = g => (g.season && g.season !== thisSeason() ? "'" + String(g.season).slice(2) + " " : "") + "Wk " + g.week;

/* Every game in the window, every stat as a column. Numbers over this week's projection are lit. */
function statTable(pick, player) {
  const cols = pick.options || [];
  const withForm = cols.filter(o => o.form && o.form.games.length);
  if (!withForm.length) return "";
  const gk = g => g.season * 100 + g.week;
  const keys = [...new Set(withForm.flatMap(o => o.form.games.map(gk)))].sort((a, b) => b - a);
  const meta = new Map();
  withForm.forEach(o => o.form.games.forEach(g => { if (!meta.has(gk(g))) meta.set(gk(g), g); }));
  const at = (o, k) => o.form ? o.form.games.find(g => gk(g) === k) : null;
  const head = cols.map(o => `<th><b>${esc(o.part)}</b>${esc(o.stat)}</th>`).join("");
  const body = keys.map(k => {
    const m = meta.get(k);
    return `<tr><td>${esc(weekLabel(m))}</td>
      <td class="opp">${m.home ? "vs" : "at"} ${esc(m.opponent)}${WH.crest(m.opponent) ? `<img src="${WH.crest(m.opponent)}" alt="">` : ""}</td>
      ${cols.map(o => { const g = at(o, k); return `<td class="v ${g && g.cleared ? "ok" : ""}">${g ? fmt(g.value) : "&middot;"}</td>`; }).join("")}</tr>`;
  }).join("");
  const foot = (label, fn) => `<tr><td colspan="2">${label}</td>${cols.map(o =>
    `<td>${o.form && o.form.games.length ? fn(o.form) : "&middot;"}</td>`).join("")}</tr>`;
  return `<div class="gt-head">${esc(player.name)}, last ${keys.length} games<span>Lit numbers beat this week's projection.</span></div>
    <div class="tblwrap"><table class="gt">
      <thead><tr><th>Week</th><th class="opp">Opponent</th>${head}</tr></thead>
      <tbody>${body}</tbody>
      <tfoot>
        ${foot("Average", f => fmt(f.average))}
        ${foot("This week's projection", f => f.line == null ? "&middot;" : fmt(f.line))}
        ${foot("Over projection", f => { if (f.line == null) return "&middot;";
          const p = Math.round(100 * f.cleared / f.played);
          return `<b class="${p >= 67 ? "hot" : p <= 33 ? "cold" : ""}">${p}%</b>`; })}
      </tfoot></table></div>`;
}

          <div class="sub">${esc(p.position)} &middot; ${esc(p.team)}${pick.opponent ? " vs " + esc(pick.opponent) : ""}${
            p.injury ? ` &middot; <span class="injury">${esc(p.injury)}</span>` : ""}</div></div>
        <div class="respins">${respin("team", entry.teamRespins, "New team")}${respin("player", entry.playerRespins, "New player")}</div>
      </div>

/* A showdown has fewer picks than stats at QB and RB, so it says how many you will use. */
function leftLine(pos, remaining) {
  const open = pos.picks.filter(p => !p.chosen).length;
  const list = remaining.map(esc).join(", ");
  return open < remaining.length ? `Use ${open} of: ${list}` : `Stats left: ${list}`;
}

function renderRail() {

/* ---- the reels: the server has already decided; the animation shows its work ---- */
const ITEM_H = () => window.matchMedia("(max-width:640px)").matches ? 48 : 64;
const FILLERS = 40;
const reelStatic = (text, hit, cls) =>
  `<div class="reel-strip"><div class="reel-item ${cls} ${hit ? "hit" : ""}">${esc(text)}</div></div>`;

function buildReel(host, items, cls) {
  const draw = () => items.length ? items[Math.floor(Math.random() * items.length)] : "?";
  const strip = [];
  for (let i = 0; i < FILLERS; i++) strip.push(draw());
  host.classList.add("reel");
  host.innerHTML = `<div class="reel-strip spinning">${strip.map(v => `<div class="reel-item ${cls}">${esc(v)}</div>`).join("")}</div>`;
  return host.querySelector(".reel-strip");
}

function landReel(strip, items, result, cls) {
  return new Promise(resolve => {
    const decoys = items.filter(v => v !== result);
    const decoy = decoys.length ? decoys[Math.floor(Math.random() * decoys.length)] : result;
    strip.insertAdjacentHTML("beforeend",
      `<div class="reel-item ${cls}">${esc(decoy)}</div><div class="reel-item ${cls} hit">${esc(result)}</div>`);
    const y = new DOMMatrix(getComputedStyle(strip).transform).m42;
    strip.classList.remove("spinning");
    strip.style.transform = `translateY(${y}px)`;
    void strip.offsetHeight;
    const h = ITEM_H();
    strip.style.transition = "transform 1.3s cubic-bezier(.12,.72,.24,1)";
    strip.style.transform = `translateY(${-(FILLERS * h)}px)`;
    setTimeout(() => {
      strip.style.transition = "transform .5s cubic-bezier(.3,1.4,.5,1)";
      strip.style.transform = `translateY(${-((FILLERS + 1) * h)}px)`;
      setTimeout(resolve, 520);
    }, 1320);
  });
}

async function spin(d) {
  const i = entry.activePick;
  const before = pickAt(i);
  const teamItems = before.teamReel && before.teamReel.length ? before.teamReel : ["?"];
  const playerItems = before.playerReel && before.playerReel.length ? before.playerReel : ["?"];
  busy = true;
  document.querySelectorAll("#stage button").forEach(b => b.disabled = true);
  // A respin clears the stage down to the reels, so the old player is not left on screen.
  document.querySelectorAll("#stage .who, #stage .say, #stage .opts, #stage .gt-head, #stage .tblwrap")
    .forEach(el => el.remove());
  const teamBox = document.getElementById("teamBox"), playerBox = document.getElementById("playerBox");
  teamBox.classList.remove("landed"); playerBox.classList.remove("landed");
  const teamImg = teamBox.querySelector("img"); if (teamImg) teamImg.remove();
  const tStrip = buildReel(document.getElementById("teamReel"), teamItems, "");
  const pStrip = buildReel(document.getElementById("playerReel"), playerItems, "name");
  const params = {};
  if (d.respin === "team") params.respinTeam = true;
  if (d.respin === "player") params.respinPlayer = true;
  let updated;
  try {
    updated = await api(`/api/play/${entry.entryId}/pick/${i}/spin`, { method: "POST", params });
  } catch (e) {
    busy = false; showErr(e); await refresh(); return;
  }
  const after = updated.positions.flatMap(x => x.picks).find(x => x.pickIndex === i);
  await landReel(tStrip, teamItems, after.team, "");
  teamBox.classList.add("landed");
  const roster = after.playerReel && after.playerReel.length ? after.playerReel : playerItems;
  const restrip = buildReel(document.getElementById("playerReel"), roster, "name");
  await landReel(restrip, roster, after.player ? after.player.name : "?", "name");
  playerBox.classList.add("landed");
  busy = false;
  entry = updated;
  showPlay();
}

async function act(d) {
  showErr(null);
  if (d.act === "spin") return spin(d);
  if (d.act === "choose") {
    document.querySelectorAll("#stage .opt").forEach(b => b.disabled = true);
    try {
      entry = await api(`/api/play/${entry.entryId}/pick/${entry.activePick}/choose`,
        { method: "POST", params: { option: d.opt } });
      if (entry.complete) { slipState = "none"; showDone(); window.scrollTo({ top: 0 }); }
      else showPlay();
    } catch (e) { showErr(e); showPlay(); }
  }
}

const showErr = e => { document.getElementById("err").textContent = e ? e.message : ""; };

/* ================= the slip ================= */

const gameOf = p => p.game || { state: "post" };
const slipFinal = e => (e.contest || {}).archive || e.positions.flatMap(p => p.picks).every(p => gameOf(p).state === "post");

function slateInfo() {
  return board && entry.slate ? board.slates.find(x => x.key === entry.slate) : null;
}

function showDone() {
  show("play", false);
  show("done", true);
  const c = entry.contest || {};
  const title = c.archive ? `${c.season} · Week ${c.week}` : `${c.label}`;
  const who = viewing ? `${esc(entry.owner)}'s roster` : "Your roster";
  document.getElementById("doneHead").innerHTML =
    (c.archive ? WH.badge("past", "Past week", "lg") : WH.badge(entry.slate, entry.slateLabel || c.label, "lg"))
    + `<h2>${who}</h2><p class="muted" style="margin-top:6px">${esc(title)}</p>`;
  renderSlip();
}

function renderSlip() {
  const host = document.getElementById("slip");
  if (slipState === "playing") return;
  const c = entry.contest || {};
  const final = slipFinal(entry);
  const picks = entry.positions.flatMap(p => p.picks);
  const started = c.archive || picks.some(p => gameOf(p).state !== "pre");

  const rows = entry.positions.map(pos => pos.picks.map((p, i) => {
    const part = (p.options.find(o => o.key === p.chosen) || {}).part || p.chosen || "";
    const g = gameOf(p);
    let v;
    if (g.state === "pre") {
      v = `<span class="sp-v pre">${fmt1(p.projectedPoints)}</span>`;
    } else {
      const dir = p.points > p.projectedPoints ? "up" : p.points < p.projectedPoints ? "dn" : "";
      v = `<span class="sp-v ${dir}">${fmt1(p.points)}<small>${g.state === "in"
        ? `<span class="clk">${esc(g.detail || "live")}</span>` : "proj " + fmt1(p.projectedPoints)}</small></span>`;
    }
    return `<div class="sp-row"><span class="sp-pos">${i === 0 ? posName(pos.slot, pos).toUpperCase() : ""}</span>
      <span class="sp-who">${WH.part(p.chosen, "pi")}<span class="sp-nm">${esc(shortName(p.player && p.player.name))}</span>
        <span class="sp-part">${esc(part)}</span></span>${v}</div>`;
  }).join("")).join("");

  const info = slateInfo();
  const st = entry.standing;
  let meta;
  if (started && st && st.of > 1) meta = `${WH.ordinal(st.rank)} of ${st.of}`;
  else if (c.archive) meta = "Final";
  else if (started) meta = final ? "Final" : "Live";
  else if (info && info.games.length === 1) meta = `Kicks off ${esc(WH.kickoffText(info.games[0].kickoff))}`;
  else if (info) meta = `Kicks off ${esc(WH.kickoffText(info.lockAt))}`;
  else meta = "Before kickoff";

  const cap = final && entry.capture ? ` &middot; ${entry.capture.capturePercent}% of max points` : "";
  const footLabel = !started ? "Projected" : `${final ? "Final" : "Live"} &middot; proj ${fmt1(entry.projectedTotal)}${cap}`;
  const big = started ? fmt1(entry.total) : fmt1(entry.projectedTotal);

  const boardHref = `/leaderboards.html?c=${encodeURIComponent(c.id)}${entry.slate ? "&s=" + encodeURIComponent(entry.slate) : ""}`;
  let acts;
  if (viewing) {
    acts = `<a class="btn go" href="/">Play Wheelhouse</a>`;
  } else {
    const again = playAgain();
    acts = `<button class="btn go" data-slip="share">${WH.icon("share")}Share</button>
      <a class="btn" href="${boardHref}">${WH.icon("trophy")}Leaderboard</a>`
      + (again ? `<button class="btn" data-slip="again">${WH.icon("again")}${esc(again.label)}</button>` : "");
  }

  host.className = "sp" + (slipState === "done" ? " instant" : "");
  host.innerHTML = `<div class="sp-head"><span class="sp-title">${esc(entry.slateLabel || (c.archive ? c.season + " Wk " + c.week : c.label))}</span>
      <span class="sp-meta">${meta}</span></div>
    ${rows}
    <div class="sp-foot"><span class="sp-meta" style="text-align:left">${footLabel}</span><span class="sp-big">${big}</span></div>
    <div class="sp-acts">${acts}</div>`;
  host.querySelectorAll("[data-slip]").forEach(b => b.addEventListener("click", () => slipAction(b)));
  renderSave();

  if (slipState === "none") {
    slipState = "playing";
    (async () => {
      for (const row of host.querySelectorAll(".sp-row")) {
        row.classList.add("in");
        await new Promise(r => setTimeout(r, 60));
      }
      slipState = "done";
    })();
  }
}

/* A guest's roster is kept but is not on the leaderboard. One card says so and fixes it. */
function renderSave() {
  let host = document.getElementById("save");
  if (!host) {
    host = document.createElement("div");
    host.id = "save";
    document.getElementById("done").appendChild(host);
  }
  if (viewing || !entry.guest) { host.innerHTML = ""; return; }
  host.innerHTML = `<div class="card save">
      <div><b>You're playing as a guest</b>
        <span>Make a profile to save this roster and put it on the leaderboard.</span></div>
      <button class="btn primary" id="saveBtn">Save my results</button></div>`;
  document.getElementById("saveBtn").addEventListener("click", async () => {
    try {
      await WH.requireAuth({ title: "Save your results",
        text: "Pick a name and a password. Everything you played as a guest comes with you." });
      location.reload();
    } catch (e) { /* closed */ }
  });
}

function playAgain() {
  const c = entry.contest || {};
  if (c.archive) return { label: "Play again", run: () => startPast(c.season, c.week) };
  const info = slateInfo();
  if (info && !info.locked && new Date(info.lockAt) > Date.now()) {
    return { label: "Play again", run: () => startSlate(info.key) };
  }
  const next = board && board.slates.find(x => x.key === board.next);
  return next ? { label: "Play " + next.label, run: () => startSlate(next.key) } : null;
}

async function slipAction(btn) {
  if (btn.dataset.slip === "again") {
    const a = playAgain();
    if (a) { show("done", false); a.run(); }
    return;
  }
  if (btn.dataset.slip === "share") {
    try {
      const { shareId } = await api(`/api/play/${entry.entryId}/share`, { method: "POST" });
      const url = location.origin + "/?s=" + shareId;
      if (navigator.share) {
        await navigator.share({ title: "My Wheelhouse roster", url });
      } else {
        await navigator.clipboard.writeText(url);
        WH.toast("Link copied");
      }
    } catch (e) {
      if (e && e.name !== "AbortError") WH.toast(e.message);
    }
  }
}

/* ================= start ================= */

async function refresh() {
  // Only a finished roster changes on its own, as games are played. A draft in progress is
  // left alone so the options never redraw under someone reading them.
  if (!entry || busy || !entry.complete) return;
  try {
    entry = await api(viewing ? `/api/play/shared/${encodeURIComponent(shareId)}` : `/api/play/${entry.entryId}`);
    if (entry.complete) showDone(); else showPlay();
  } catch (e) { /* keep what is on screen */ }
}

function gone(title, text, cta) {
  show("gone", true);
  document.getElementById("gone").innerHTML = `<b>${esc(title)}</b>${esc(text)}<br>${cta}`;
}

(async function init() {
  const navDone = WH.nav("play");
  try { board = await api("/api/play/slates"); } catch (e) { board = null; }
  const who = await WH.me();
  if (who.signedIn || who.guest) {
    try { mine = (await api("/api/account/rosters")).rosters; } catch (e) { mine = []; }
  }
  await navDone;

  if (shareId) {
    try {
      entry = await api(`/api/play/shared/${encodeURIComponent(shareId)}`);
      viewing = true;
      showDone();
    } catch (e) {
      gone("Link not found", "That roster link doesn't work anymore.", `<a class="btn primary" href="/">Play</a>`);
    }
  } else if (rosterId) {
    try {
      entry = await api(`/api/play/${encodeURIComponent(rosterId)}`);
      slipState = entry.complete ? "done" : "none";
      if (entry.complete) showDone(); else showPlay();
    } catch (e) {
      if (e.status === 401 || (e.status === 403 && !who.signedIn)) {
        const back = encodeURIComponent(location.pathname + location.search);
        gone("Sign in to see this roster", "Rosters belong to a profile.",
          `<a class="btn primary" href="/profile.html?mode=signin&next=${back}">Sign in</a>`);
      } else {
        gone("Roster not found", e.message, `<a class="btn primary" href="/">Go home</a>`);
      }
    }
  } else {
    await showHome();
  }
  WH.ready();
  setInterval(() => { if (!document.hidden) refresh(); }, 15000);
})();
</script>
