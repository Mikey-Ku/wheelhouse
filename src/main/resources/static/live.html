<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live · Wheelhouse</title>
<meta name="theme-color" content="#05091d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .filters button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-hi);background:var(--surface);
    color:var(--secondary);font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .mine{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
  .mine a{flex:0 0 auto;display:flex;align-items:center;gap:12px;text-decoration:none;background:rgba(19,27,56,.9);
    border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .mine a:hover{border-color:var(--accent)}
  .mine b{font-family:var(--display);font-size:24px;line-height:1}
  .mine small{display:block;font-size:11px;color:var(--muted)}
  .day{margin-top:28px}
  .day-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
  .game{background:rgba(19,27,56,.92);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .game.in{border-color:rgba(255,77,109,.6)}
  .game button.face-btn{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px 16px;cursor:pointer}
  .game button.face-btn:disabled{cursor:default}
  .g-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--secondary)}
  .g-top .clock{display:flex;align-items:center;gap:7px;font-family:var(--mono)}
  .game.in .g-top .clock{color:var(--live)}
  .g-team{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:5px 0}
  .g-team .nm{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
  .g-team .rec{font-size:12px;color:var(--muted);margin-left:6px;font-family:var(--sans);font-weight:400}
  .g-team .sc{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
  .game.post .g-team.lost{opacity:.55}
  .leaders{border-top:1px solid var(--line);padding:12px 16px 14px;background:rgba(11,16,40,.6)}
  .ld-team{margin-bottom:10px}
  .ld-team:last-child{margin-bottom:0}
  .ld-team h4{font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
  .ld{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;font-size:13.5px;padding:3px 0}
  .ld span:first-child{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .ld b{font-weight:600}
  .ld em{font-style:normal;color:var(--secondary);font-family:var(--mono);font-size:12.5px;margin-left:6px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body data-page="live">
<nav id="nav" class="top"></nav>
<main class="wrap">
  <div class="page-head"><h1 id="title">Live</h1><p>Every game this week. Tap a game that has started for its leaders.</p></div>
  <div id="mineSec"></div>
  <div class="filters" id="filters"></div>
  <div id="days"></div>
</main>
<script src="/app.js"></script>
<script>
const { esc, fmt1, api } = WH;
let data = null;
let slates = [];
let filter = "all";
const open = new Set();
const leaders = new Map();

const LABEL = key => (slates.find(s => s.key === key) || {}).label || "Other games";

function gameCard(g) {
  const started = g.state !== "pre";
  const clock = g.state === "pre"
    ? `${esc(WH.kickoffText(g.kickoff))}${g.network ? " &middot; " + esc(g.network) : ""}`
    : g.state === "in" ? `<span class="dot"></span>${esc(g.detail)}` : esc(g.detail || "Final");
  const team = (t, other) => {
    const lost = g.state === "post" && Number(t.score) < Number(other.score);
    return `<div class="g-team ${lost ? "lost" : ""}"><img class="crest" src="${esc(t.logo)}" alt="">
      <span class="nm">${esc(t.abbr)}<span class="rec">${esc(t.record)}</span></span>
      <span class="sc">${started ? esc(t.score) : ""}</span></div>`;
  };
  const ld = open.has(g.id) ? leadersHtml(g.id) : "";
  return `<div class="game ${esc(g.state)}">
    <button class="face-btn" data-id="${esc(g.id)}" ${started ? "" : "disabled"} aria-expanded="${open.has(g.id)}">
      <div class="g-top"><span class="clock">${clock}</span>${started ? `<span>${open.has(g.id) ? "Hide" : "Leaders"}</span>` : ""}</div>
      ${team(g.away, g.home)}${team(g.home, g.away)}
    </button>${ld}</div>`;
}

function leadersHtml(id) {
  const d = leaders.get(id);
  if (!d) return `<div class="leaders"><span class="muted small">Loading…</span></div>`;
  if (!d.teams || !d.teams.length) return `<div class="leaders"><span class="muted small">No stats yet.</span></div>`;
  return `<div class="leaders">${d.teams.map(t => `<div class="ld-team"><h4>${esc(t.abbr)}</h4>
    ${t.leaders.map(l => `<div class="ld"><span>${esc(l.stat)}</span><span><b>${esc(l.name)}</b><em>${esc(l.line)}</em></span></div>`).join("")}
  </div>`).join("")}</div>`;
}

function render() {
  const games = data ? data.games : [];
  const keys = [...new Set(games.map(g => g.slate || "other"))];
  document.getElementById("filters").innerHTML = keys.length > 1
    ? [`<button data-f="all" class="${filter === "all" ? "on" : ""}">All</button>`]
        .concat(keys.map(k => `<button data-f="${esc(k)}" class="${filter === k ? "on" : ""}">${esc(LABEL(k))}</button>`)).join("")
    : "";
  const shown = keys.filter(k => filter === "all" || filter === k);
  document.getElementById("days").innerHTML = shown.map(k => {
    const list = games.filter(g => (g.slate || "other") === k)
      .sort((a, b) => (a.state === "in" ? -1 : 0) - (b.state === "in" ? -1 : 0) || new Date(a.kickoff) - new Date(b.kickoff));
    return `<section class="day"><div class="day-head">${WH.badge(k, LABEL(k), "lg")}</div>
      <div class="games">${list.map(gameCard).join("")}</div></section>`;
  }).join("") || `<div class="empty"><b>No games</b>Check back when the week's schedule is out.</div>`;
}

async function renderMine() {
  const host = document.getElementById("mineSec");
  const who = await WH.me();
  if (!who.signedIn) { host.innerHTML = ""; return; }
  try {
    const rs = (await api("/api/account/rosters")).rosters.filter(r => r.current && r.complete);
    if (!rs.length) { host.innerHTML = ""; return; }
    host.innerHTML = `<div class="sec-head" style="margin-top:0"><h2>Your rosters</h2></div>
      <div class="mine">${rs.map(r => {
        const pending = r.status === "pending";
        return `<a href="/?r=${esc(r.entryId)}">${WH.badge(r.slate, r.label.split(" · ")[1] || r.label)}
          <div><b>${fmt1(pending ? r.projectedTotal : r.total)}</b>
            <small>${pending ? "projected" : r.status === "live" ? "live" : "final"}${r.standing && r.standing.of > 1 && !pending
              ? " &middot; " + WH.ordinal(r.standing.rank) + " of " + r.standing.of : ""}</small></div></a>`;
      }).join("")}</div><div style="height:18px"></div>`;
  } catch (e) { host.innerHTML = ""; }
}

async function toggle(id) {
  if (open.has(id)) { open.delete(id); render(); return; }
  open.add(id);
  render();
  try { leaders.set(id, await api(`/api/scores/${encodeURIComponent(id)}`)); }
  catch (e) { leaders.set(id, { teams: [] }); }
  render();
}

async function load() {
  try { data = await api("/api/scores"); } catch (e) { data = data || { games: [] }; }
  if (data.week) document.getElementById("title").innerHTML = `${esc(data.week)} <span style="color:var(--accent)">Live</span>`;
  // Leaders for open live games move too.
  for (const id of open) {
    const g = data.games.find(x => x.id === id);
    if (g && g.state === "in") {
      try { leaders.set(id, await api(`/api/scores/${encodeURIComponent(id)}`)); } catch (e) { /* keep */ }
    }
  }
  render();
}

(async function init() {
  const navDone = WH.nav("live");
  try { slates = (await api("/api/play/slates")).slates; } catch (e) { slates = []; }
  await Promise.all([navDone, load(), renderMine()]);
  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    filter = b.dataset.f; render();
  });
  document.getElementById("days").addEventListener("click", e => {
    const b = e.target.closest("button[data-id]"); if (b && !b.disabled) toggle(b.dataset.id);
  });
  WH.ready();
  setInterval(() => { if (!document.hidden) { load(); renderMine(); } }, 20000);
})();
</script>
</body>
</html>
