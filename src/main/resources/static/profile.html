<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile · Wheelhouse</title>
<meta name="theme-color" content="#05091d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .auth{max-width:440px;margin:30px auto 0}
  .auth h1{font-size:44px;margin-bottom:8px}
  .auth p{color:var(--secondary);margin-bottom:20px}
  .me-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:34px 0 20px}
  .me-head h1{font-size:clamp(36px,5vw,54px);word-break:break-word}
  .me-head .acts{margin-left:auto;display:flex;gap:8px}
  .rename{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;max-width:520px}
  .rename input{flex:1;min-width:200px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .stat{background:rgba(19,27,56,.9);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat b{display:block;font-family:var(--display);font-size:40px;line-height:1}
  .stat span{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;
    background:rgba(19,27,56,.9);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    text-decoration:none}
  .row:hover{border-color:var(--line-hi)}
  .row .l{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
  .row .lbl{font-size:15px}
  .row .score{text-align:right;font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
  .row .score small{display:block;font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--muted)}
  @media (max-width:640px){.row{grid-template-columns:minmax(0,1fr) auto}.row .pill{display:none}}
</style>
</head>
<body data-page="profile">
<nav id="nav" class="top"></nav>
<main class="wrap" id="main"></main>
<script src="/app.js"></script>
<script>
const { esc, fmt1, api } = WH;

async function signedOut(who) {
  const main = document.getElementById("main");
  const guest = who && who.guest;
  main.innerHTML = `<div class="auth"><h1>${guest ? "Save your results" : "Your profile"}</h1>
    <p>${guest
      ? "You're playing as a guest. Make a profile to keep your rosters and get on the leaderboards. Everything you've played comes with you."
      : "Pick a name and a password. Your rosters, scores and spot on the leaderboards are saved to it."}</p>
    <div class="card" id="authHost"></div></div><div id="guestRosters"></div>`;
  // Back to where sign-in was asked for, if that was a page on this site.
  const next = new URLSearchParams(location.search).get("next");
  const done = () => { location.href = next && /^\/(?![\/\\])/.test(next) ? next : "/profile.html"; };
  WH.authForm(document.getElementById("authHost"), done,
    new URLSearchParams(location.search).get("mode") === "signin" ? "signin" : "signup");
  if (guest) {
    try {
      const rs = (await api("/api/account/rosters")).rosters;
      document.getElementById("guestRosters").innerHTML =
        section("Played as a guest", rs, "Not on the leaderboards until you save them.");
    } catch (e) { /* none */ }
  }
}

const STATUS = {
  building: r => `<span class="pill">${r.locked ? "Unfinished" : "In progress"} &middot; ${r.picked}/${r.totalPicks}</span>`,
  pending: () => `<span class="pill">Before kickoff</span>`,
  live: () => `<span class="pill live"><span class="dot"></span>Live</span>`,
  final: () => `<span class="pill final">Final</span>`,
};

function row(r) {
  const badge = r.archive ? WH.badge("past", "Past week") : WH.badge(r.slate, (r.label.split(" · ")[1] || r.label));
  let score;
  if (!r.complete) score = `<div class="score" style="font-size:16px">${r.locked ? "&middot;" : "Finish"}</div>`;
  else if (r.status === "pending") score = `<div class="score">${fmt1(r.projectedTotal)}<small>projected</small></div>`;
  else {
    const st = r.standing && r.standing.of > 1 ? `${WH.ordinal(r.standing.rank)} of ${r.standing.of}` : "pts";
    score = `<div class="score">${fmt1(r.total)}<small>${st}</small></div>`;
  }
  return `<a class="row" href="/?r=${esc(r.entryId)}">
    <div class="l">${badge}<span class="lbl">${esc(r.label)}</span></div>
    ${STATUS[r.status] ? STATUS[r.status](r) : ""}${score}</a>`;
}

function section(title, list, note) {
  if (!list.length) return "";
  return `<section class="sec"><div class="sec-head"><h2>${title}</h2>${note ? `<p>${note}</p>` : ""}</div>
    <div class="rows">${list.map(row).join("")}</div></section>`;
}

async function signedIn(who) {
  const data = await api("/api/account/rosters");
  const rs = data.rosters;
  const open = rs.filter(r => !r.complete && !r.locked);
  const thisWeek = rs.filter(r => r.current && (r.complete || r.locked));
  const earlier = rs.filter(r => !r.current && !r.archive && (r.complete || r.locked));
  const past = rs.filter(r => r.archive && r.complete);

  const main = document.getElementById("main");
  main.innerHTML = `<div class="me-head"><h1 id="nameH">${esc(data.name)}</h1>
      <div class="acts"><button class="btn sm" id="renameBtn">Change name</button>
        <button class="btn sm ghost" id="outBtn">Sign out</button></div></div>
    <div id="renameHost"></div>
    <div class="stats">
      <div class="stat"><span>Rosters played</span><b>${data.played}</b></div>
      <div class="stat"><span>Best finish</span><b>${data.bestRank ? WH.ordinal(data.bestRank) : "&ndash;"}</b></div>
      <div class="stat"><span>% of max points</span><b>${data.avgCapture == null ? "&ndash;" : data.avgCapture + "%"}</b>
        <small>Your points against the best you could have scored with the same players.</small></div>
    </div>
    ${section("Finish these", open, "Unfinished rosters for slates that haven't locked yet.")}
    ${section("This week", thisWeek)}
    ${section("Earlier this season", earlier)}
    ${section("Past weeks", past)}
    ${rs.length ? "" : `<div class="empty" style="margin-top:30px"><b>No rosters yet</b>Your rosters show up here once you play.
      <br><a class="btn primary" href="/">Play</a></div>`}`;

  document.getElementById("outBtn").addEventListener("click", async () => {
    await api("/api/account/signout", { method: "POST" });
    location.href = "/";
  });
  document.getElementById("renameBtn").addEventListener("click", () => {
    const host = document.getElementById("renameHost");
    host.innerHTML = `<form class="rename" style="margin-bottom:20px">
        <input name="name" maxlength="20" value="${esc(data.name)}" aria-label="New name">
        <button class="btn primary" type="submit">Save</button>
        <button class="btn ghost" type="button" id="cancelRename">Cancel</button></form>
      <p class="err" id="renameErr" style="margin:-10px 0 16px"></p>`;
    const form = host.querySelector("form");
    form.name.focus(); form.name.select();
    host.querySelector("#cancelRename").addEventListener("click", () => { host.innerHTML = ""; });
    form.addEventListener("submit", async e => {
      e.preventDefault();
      try {
        const r = await api("/api/account/name", { method: "POST", body: { name: form.name.value } });
        document.getElementById("nameH").textContent = r.name;
        host.innerHTML = "";
        await WH.me(true);
        WH.nav("profile");
        WH.toast("Name changed");
      } catch (x) { document.getElementById("renameErr").textContent = x.message; }
    });
  });
}

(async function init() {
  await WH.nav("profile");
  const who = await WH.me();
  if (who.signedIn) await signedIn(who); else await signedOut(who);
  WH.ready();
})();
</script>
</body>
</html>
